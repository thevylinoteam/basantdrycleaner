name: Basant validation
on:
  push:
    branches: [basant-english-branding, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  php-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, mysqli
          coverage: none
      - name: PHP syntax
        run: find app tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Localization smoke tests
        run: php tests/basant_localization.php
